[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-python"

version = "0.1.0"
description = "Custom Python codec enabling emojis as variables, functions, and classes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
keywords = ["emoji", "codec", "python", "unicode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
emoji = "emoji_python.run:main"
emoji-run = "emoji_python.run:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["emoji_python*"]
